# Build the web/ site with nix (elm 0.19.2 -- which is nixpkgs-only, not on npm)
# and commit web/dist. Cloudflare Pages serves that pre-built output directly, so
# no elm toolchain or secrets are needed in Cloudflare's build.
name: build-web
on:
  push:
    branches: [main]
    paths:
      - "web/src/**"
      - "web/js/**"
      - "web/index.html"
      - "web/elm.json"
permissions:
  contents: write
concurrency:
  group: build-web
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build with nix (elm 0.19.2 + esbuild)
        working-directory: web
        run: |
          rm -rf dist
          nix shell nixpkgs#elmPackages.elm nixpkgs#esbuild --command bash -c '
            elm make src/Main.elm --optimize --output=dist/elm.js &&
            esbuild js/app.js --bundle --format=esm --minify --outfile=dist/app.js &&
            cp index.html dist/'
      - name: Commit web/dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/dist
          git diff --cached --quiet || git commit -m "build: refresh web/dist [skip ci]"
          git push
