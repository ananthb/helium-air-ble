<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#033129" />
  <title>A/C</title>
  <style>
    :root { --bg:#f4f6f5; --card:#fff; --ink:#0d1f1b; --muted:#6b7f79; --brand:#033129; --accent:#1f9d78; --line:#e4eae7; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1512; --card:#12211c; --ink:#eaf3ef; --muted:#8fa39c; --brand:#0a5; --line:#1e3129; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:420px; margin:0 auto; padding:20px 16px 40px; min-height:100vh; display:flex; flex-direction:column; gap:16px; }
    header { display:flex; align-items:baseline; gap:10px; }
    h1 { font-size:22px; margin:0; color:var(--brand); }
    @media (prefers-color-scheme: dark) { h1 { color:var(--accent); } }
    .sub { color:var(--muted); font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .center { text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; }
    .room { text-align:center; }
    .big { font-size:56px; font-weight:600; letter-spacing:-2px; }
    .muted { color:var(--muted); font-size:13px; }
    .ctl { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; }
    .ctl:last-child { border-bottom:0; }
    .label { color:var(--muted); font-size:14px; }
    button { font:inherit; cursor:pointer; border:0; border-radius:10px; }
    .primary { background:var(--accent); color:#fff; padding:12px 22px; font-weight:600; font-size:16px; }
    .ghost { background:transparent; color:var(--muted); padding:10px; align-self:center; }
    .sw { background:var(--line); color:var(--ink); padding:8px 18px; font-weight:600; }
    .sw.on { background:var(--accent); color:#fff; }
    .stepper { display:flex; align-items:center; gap:6px; }
    .stepper button { background:var(--line); color:var(--ink); width:38px; height:38px; font-size:20px; }
    .stepper .val { min-width:56px; text-align:center; font-size:20px; font-weight:600; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .chip { background:var(--line); color:var(--ink); padding:7px 12px; font-size:13px; text-transform:capitalize; }
    .chip.sel { background:var(--brand); color:#fff; }
    @media (prefers-color-scheme: dark) { .chip.sel { background:var(--accent); } }
    .pin { font-size:28px; letter-spacing:12px; text-align:center; width:160px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
    .err { background:#fdecea; color:#7a271a; border:1px solid #f5c2bd; padding:10px 14px; border-radius:10px; font-size:14px; }
    @media (prefers-color-scheme: dark) { .err { background:#2a1512; color:#f6c9c2; border-color:#5a241d; } }
    footer { color:var(--muted); font-size:12px; text-align:center; margin-top:auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
